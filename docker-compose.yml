services:
  # Ensures the bind-mounted storage dirs are owned by the app user (uid 1000)
  # before the app starts. Docker auto-creates a missing bind-mount source as
  # root, which the non-root app can't write to; this runs as root and fixes it
  # idempotently. Every host-path bind mount used by `app` belongs here.
  storage-init:
    image: busybox:1.36
    user: "0:0"
    volumes:
      - ${VIDEO_HOST_PATH:-./data/video}:/data/video
      - ${ARTIFACT_HOST_PATH:-./data/artifacts}:/data/artifacts
    command: sh -c "mkdir -p /data/video /data/artifacts && chown 1000:1000 /data/video /data/artifacts"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    # Worker count is deployment-tunable (Dockerfile default: 2). With
    # Redis-shared admission (mr:adm:* counters), backends.max_concurrent is a
    # FLEET-WIDE cap independent of worker count. Size DATABASE_POOL_SIZE so
    # workers x (async+sync pools) stays under MariaDB max_connections (512).
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${UVICORN_WORKERS:-2}", "--timeout-graceful-shutdown", "60"]
    environment:
      - DATABASE_URL=mysql+pymysql://mindrouter:${MYSQL_PASSWORD:-mindrouter_password}@127.0.0.1:3306/mindrouter
      # Redis now requires a password (see the redis service below). The default
      # keeps a fresh `docker compose up` working locally; override REDIS_PASSWORD
      # in .env to change it. Keep this URL's password in sync with that service.
      - REDIS_URL=redis://:${REDIS_PASSWORD:-mindrouter_dev_redis}@127.0.0.1:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - ARTIFACT_STORAGE_PATH=/data/artifacts
      - CHAT_FILES_PATH=/data/chat_files
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      - BACKEND_IMAGE_REQUEST_TIMEOUT=${BACKEND_IMAGE_REQUEST_TIMEOUT:-600}
      - BACKEND_TIMEOUT_TRIPS_BREAKER=${BACKEND_TIMEOUT_TRIPS_BREAKER:-false}
      - BACKEND_RETRY_ON_TIMEOUT=${BACKEND_RETRY_ON_TIMEOUT:-false}
      # Security hardening (2.9.18 audit remediation — see backend/app/settings.py).
      # Defaults preserve current behavior; set the prod-hardening values in .env:
      #   SESSION_COOKIE_SECURE=true, ENABLE_API_DOCS=false.
      - SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-false}
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-true}
      - 'CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-[]}'
      - IMAGE_URL_BLOCK_PRIVATE=${IMAGE_URL_BLOCK_PRIVATE:-true}
      - 'IMAGE_URL_ALLOWED_SCHEMES=${IMAGE_URL_ALLOWED_SCHEMES:-["http","https","data"]}'
      - OCR_MAX_FRAMES=${OCR_MAX_FRAMES:-500}
      - CHAT_UPLOAD_MAX_UNCOMPRESSED_MB=${CHAT_UPLOAD_MAX_UNCOMPRESSED_MB:-100}
      - MAX_COMPLETIONS_N=${MAX_COMPLETIONS_N:-8}
      - LOGIN_MAX_ATTEMPTS_PER_WINDOW=${LOGIN_MAX_ATTEMPTS_PER_WINDOW:-15}
      - LOGIN_ATTEMPT_WINDOW_SECONDS=${LOGIN_ATTEMPT_WINDOW_SECONDS:-300}
      - RATE_LIMIT_LOCAL_FALLBACK=${RATE_LIMIT_LOCAL_FALLBACK:-true}
      - TOKENIZE_MAX_INPUT_CHARS=${TOKENIZE_MAX_INPUT_CHARS:-2000000}
      # Audit content capture (see backend/app/settings.py — keep in sync).
      # Disabling capture also disables DLP scanning of that content.
      # SAML SP key pair (inline PEM or a path to a mounted file) — needed
      # only for encrypted assertions / signed AuthnRequests. Secrets: host
      # .env only, never committed.
      - SAML_SP_X509_CERT=${SAML_SP_X509_CERT:-}
      - SAML_SP_PRIVATE_KEY=${SAML_SP_PRIVATE_KEY:-}
      - SAML_AUTHN_REQUESTS_SIGNED=${SAML_AUTHN_REQUESTS_SIGNED:-false}
      - SAML_WANT_ASSERTIONS_ENCRYPTED=${SAML_WANT_ASSERTIONS_ENCRYPTED:-false}
      # Opt-in `alembic upgrade head` at startup, for a fresh database.
      # Run single-worker on first boot to avoid concurrent DDL.
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-false}
      - AUDIT_LOG_ENABLED=${AUDIT_LOG_ENABLED:-true}
      - AUDIT_LOG_PROMPTS=${AUDIT_LOG_PROMPTS:-true}
      - AUDIT_LOG_RESPONSES=${AUDIT_LOG_RESPONSES:-true}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-30}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID:-}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET:-}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID:-}
      - AZURE_AD_REDIRECT_URI=${AZURE_AD_REDIRECT_URI:-}
      - AZURE_AD_DEFAULT_GROUP=${AZURE_AD_DEFAULT_GROUP:-other}
      - GOOGLE_SSO_CLIENT_ID=${GOOGLE_SSO_CLIENT_ID:-}
      - GOOGLE_SSO_CLIENT_SECRET=${GOOGLE_SSO_CLIENT_SECRET:-}
      - GOOGLE_SSO_REDIRECT_URI=${GOOGLE_SSO_REDIRECT_URI:-}
      - GOOGLE_SSO_HOSTED_DOMAIN=${GOOGLE_SSO_HOSTED_DOMAIN:-}
      - GOOGLE_SSO_DEFAULT_GROUP=${GOOGLE_SSO_DEFAULT_GROUP:-other}
      - OIDC_SSO_ISSUER=${OIDC_SSO_ISSUER:-}
      - OIDC_SSO_CLIENT_ID=${OIDC_SSO_CLIENT_ID:-}
      - OIDC_SSO_CLIENT_SECRET=${OIDC_SSO_CLIENT_SECRET:-}
      - OIDC_SSO_REDIRECT_URI=${OIDC_SSO_REDIRECT_URI:-}
      - OIDC_SSO_DISPLAY_NAME=${OIDC_SSO_DISPLAY_NAME:-SSO}
      - OIDC_SSO_SCOPES=${OIDC_SSO_SCOPES:-openid profile email}
      - OIDC_SSO_DEFAULT_GROUP=${OIDC_SSO_DEFAULT_GROUP:-other}
      - SAML_SP_ENTITY_ID=${SAML_SP_ENTITY_ID:-}
      - SAML_SP_ACS_URL=${SAML_SP_ACS_URL:-}
      - SAML_IDP_METADATA_URL=${SAML_IDP_METADATA_URL:-}
      - SAML_IDP_ENTITY_ID=${SAML_IDP_ENTITY_ID:-}
      - SAML_IDP_SSO_URL=${SAML_IDP_SSO_URL:-}
      - SAML_IDP_X509_CERT=${SAML_IDP_X509_CERT:-}
      - SAML_DISPLAY_NAME=${SAML_DISPLAY_NAME:-SSO}
      - SAML_DEFAULT_GROUP=${SAML_DEFAULT_GROUP:-other}
      - SAML_ATTR_EMAIL=${SAML_ATTR_EMAIL:-mail}
      - SAML_ATTR_NAME=${SAML_ATTR_NAME:-displayName}
      - SAML_ATTR_USERNAME=${SAML_ATTR_USERNAME:-eduPersonPrincipalName}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      # Public HTTPS origin of this deployment — set it in .env (SSO redirect
      # URIs and SAML Destination validation derive from it).
      - APP_BASE_URL=${APP_BASE_URL:-}
      - ARCHIVE_DATABASE_URL=mysql+pymysql://mindrouter_archive:${MYSQL_ARCHIVE_PASSWORD:-archive_password}@127.0.0.1:3307/mindrouter_archive
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-mindrouter}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://127.0.0.1:8001}
      - RESPONSES_API_ENABLED=${RESPONSES_API_ENABLED:-true}
      # Streaming write coalescing (see backend/app/settings.py — keep in sync)
      - STREAM_COALESCE_EVENTS=${STREAM_COALESCE_EVENTS:-8}
      - STREAM_COALESCE_MS=${STREAM_COALESCE_MS:-50}
      # Video generation (see backend/app/settings.py — keep in sync)
      - VIDEO_STORAGE_PATH=${VIDEO_STORAGE_PATH:-/data/video}
      - VIDEO_RUNNER_ENABLED=${VIDEO_RUNNER_ENABLED:-true}
      - VIDEO_RUNNER_POLL_INTERVAL_SECONDS=${VIDEO_RUNNER_POLL_INTERVAL_SECONDS:-5}
      - VIDEO_WORKER_TIMEOUT_SECONDS=${VIDEO_WORKER_TIMEOUT_SECONDS:-60}
      - VIDEO_WORKER_FETCH_TIMEOUT_SECONDS=${VIDEO_WORKER_FETCH_TIMEOUT_SECONDS:-900}
      - VIDEO_WORKER_API_KEY=${VIDEO_WORKER_API_KEY:-}
      - VIDEO_WORKER_FETCH_MAX_MB=${VIDEO_WORKER_FETCH_MAX_MB:-2048}
      - INTERNAL_TLS_VERIFY=${INTERNAL_TLS_VERIFY:-true}
      - VIDEO_JOB_MAX_WALL_SECONDS=${VIDEO_JOB_MAX_WALL_SECONDS:-3600}
      - VIDEO_JOB_STALE_HEARTBEAT_SECONDS=${VIDEO_JOB_STALE_HEARTBEAT_SECONDS:-120}
      - VIDEO_RECONCILE_INTERVAL_SECONDS=${VIDEO_RECONCILE_INTERVAL_SECONDS:-20}
      - VIDEO_RUNNER_LEASE_TTL_SECONDS=${VIDEO_RUNNER_LEASE_TTL_SECONDS:-30}
      - VIDEO_MAX_UPLOAD_MB=${VIDEO_MAX_UPLOAD_MB:-64}
      - VIDEO_WEBHOOK_SIGNING_KEY=${VIDEO_WEBHOOK_SIGNING_KEY:-}
      # UI branding (see backend/app/settings.py — keep in sync)
      - BRANDING_STORAGE_PATH=${BRANDING_STORAGE_PATH:-/data/branding}
      - BRANDING_MAX_LOGO_MB=${BRANDING_MAX_LOGO_MB:-4}
    volumes:
      - ${ARTIFACT_HOST_PATH:-./data/artifacts}:/data/artifacts
      - ${VIDEO_HOST_PATH:-./data/video}:/data/video
      - chat_data:/data/chat_files
      - branding_data:/data/branding
      - ./backend:/app/backend:ro
    depends_on:
      mariadb:
        condition: service_healthy
      mariadb-archive:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Must exceed uvicorn's --timeout-graceful-shutdown 60 (Dockerfile) so
    # the lifespan shutdown hook (Redis admission-slot cleanup, counter
    # flush) actually runs before Docker's SIGKILL.
    stop_grace_period: 75s
    restart: unless-stopped

  mariadb:
    image: mariadb:11.2
    network_mode: host
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=mindrouter
      - MYSQL_USER=mindrouter
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mindrouter_password}
      - MYSQL_TCP_PORT=3306
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mariadb-archive:
    image: mariadb:11.2
    network_mode: host
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ARCHIVE_ROOT_PASSWORD:-archive_root_password}
      - MYSQL_DATABASE=mindrouter_archive
      - MYSQL_USER=mindrouter_archive
      - MYSQL_PASSWORD=${MYSQL_ARCHIVE_PASSWORD:-archive_password}
      - MYSQL_TCP_PORT=3307
    volumes:
      - ${ARCHIVE_DB_HOST_PATH:-./data/archive-mariadb}:/var/lib/mysql
      - ./mariadb/archive.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    network_mode: host
    volumes:
      - redis_data:/data
    healthcheck:
      # Authenticated ping: with requirepass set, an unauthenticated PING is
      # rejected (NOAUTH), so the healthcheck must pass the password.
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-mindrouter_dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    # Redis requires a password. The default matches REDIS_URL above so a local
    # `docker compose up` works out of the box; set REDIS_PASSWORD in .env to
    # override (keep it in sync with the app/mcp REDIS_URL).
    command: redis-server --appendonly yes --port 6379 --requirepass ${REDIS_PASSWORD:-mindrouter_dev_redis}

  # Standalone MCP SSE server (single worker for session affinity)
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    environment:
      - DATABASE_URL=mysql+pymysql://mindrouter:${MYSQL_PASSWORD:-mindrouter_password}@127.0.0.1:3306/mindrouter
      - REDIS_URL=redis://:${REDIS_PASSWORD:-mindrouter_dev_redis}@127.0.0.1:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-mindrouter}-mcp
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    command: ["uvicorn", "backend.app.mcp_entrypoint:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1", "--timeout-graceful-shutdown", "30"]

  # GPU sidecar agent for per-GPU hardware metrics
  gpu-sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile.sidecar
    network_mode: host
    environment:
      - GPU_AGENT_PORT=8007
      - GPU_AGENT_HOST=0.0.0.0
      # Explicit empty default: hosts that never start the gpu profile (the
      # gateway) otherwise get an unset-variable warning on every compose
      # command. gpu_agent.py refuses to start on a blank key regardless.
      - SIDECAR_SECRET_KEY=${SIDECAR_SECRET_KEY:-}
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  mariadb_data:
  mariadb_archive_data:
  redis_data:
  artifact_data:
  chat_data:
  branding_data:
