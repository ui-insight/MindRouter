# nginx vhost fronting one mesh-worker container (mirrors the video-worker
# vhost). One server block per worker instance; the container is published on
# loopback only (deploy/mesh-worker@.service, MESH_HOST_PORT).
#
# aspen nodes are reachable from the gateway only on 8000-8010: pick a free
# port in that range for the TLS front (8006 below is an example).
#
# Place in the node's nginx conf.d and `nginx -t && systemctl reload nginx`.
server {
    # HTTP/2 deliberately OFF. Fleet rule after CVE-2026-123007 (nginx HTTP/2
    # RCE, 2026-11-18 audit): NEVER add "http2" to these listen lines or an
    # "http2 on;" directive. The gateway speaks HTTP/1.1 to workers anyway.
    listen 8006 ssl;
    listen [::]:8006 ssl;
    server_name _;

    # ssl_certificate / ssl_certificate_key: the node's existing certs (same
    # lines as the other vhosts on this node).

    # Input images arrive base64 in the JSON body (worker cap: 32 MiB decoded
    # ≈ 43 MiB encoded).
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:18401;   # MESH_HOST_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 900s;   # a large GLB fetch may run a while
        proxy_send_timeout 900s;
        proxy_buffering off;       # stream content; keep /health + poll snappy
    }
}
