# nginx vhost fronting the LTX-2.5 video worker (second worker on the same
# node as nginx-video-worker.conf). aspen nodes are reachable from the gateway
# only on 8000-8010, so the TLS front sits on 8005; uvicorn stays on loopback.
server {
    listen 8005 ssl;
    listen [::]:8005 ssl;
    server_name _;

    # ssl_certificate / ssl_certificate_key: the node's existing certs (same
    # lines as the LTX-2.3 vhost).

    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:18302;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
